name: Auto Crop, Analyze, and Organize Website Artwork

on:
  push:
    paths:
      - 'ready-to-scan/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-images:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Image Processing & Gemini Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python process_images.py

      - name: Commit and Push All Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: process images & gemini analysis"
          file_pattern: "ready-to-scan/** website-artwork/**"
