name: Run Menu Keyword Scraper

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'menu-keyword-scraper/**'

jobs:
  run-keyword-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r menu-keyword-scraper/requirements.txt

      - name: Run script
        run: python menu-keyword-scraper/scraper.py

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add menu-keyword-scraper/website_menu_keywords.csv
          git commit -m "Auto-update website menu keyword mapping CSV [skip ci]" || exit 0
          git push
